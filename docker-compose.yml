services:
  mongo:
    image: mongo:7
    container_name: upholic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upholic-ingestor
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=UPHOLIC2_O
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: upholic-scanner
    command: ["python", "-u", "breakout_scanner.py"]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=UPHOLIC2_O
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: upholic-dashboard
    command: ["streamlit", "run", "breakout_scanner_ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=UPHOLIC2_O
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
